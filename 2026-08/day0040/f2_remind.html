<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="f2_remind.css">
</head>

<body>
    <h2>학습 신청</h2>
    <div class="content d-flex gap-3 align-items-start">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title">Python</h3>
                <p class="card-text">기초 프로그래밍을 공부합니다.</p>

                <button class="btn btn-primary">학습 시작 버튼</button>
            </div>
        </div>

        <div class="apply-form">
            <div class="mb-3">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" class="form-control">
            </div>

            <div class="mb-3">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" class="form-control">
            </div>

            <button class="btn btn-primary">신청하기 버튼</button>

        </div>
    </div>
</body>

</html>
