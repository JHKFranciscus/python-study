<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="f2_final_unified_page.css">
</head>

<body>
    <nav class="d-flex justify-content-between mb-3 nav-sec">
        <h1>My Study</h1>

        <div class="d-flex gap-3">
            <a href="#">홈</a>
            <a href="#">학습</a>
            <a href="#">프로필</a>
        </div>
    </nav>

    <section class="d-flex justify-content-center second-section">
        <div>
            <p class="d-flex justify-content-center">학습 프로필</p>
            <p class="d-flex justify-content-center">오늘도 학습을 계속해보세요</p>
        </div>
    </section>



    <section class="prof-card">
        <h2 class="mb-4">프로필 정보</h2>

        <div class="d-flex gap-3 mb-3">
            <label for="name" style="width: 80px">이름</label>
            <input type="text" id="name" name="name" class="form-control">
        </div>

        <div class="d-flex gap-3 mb-3">
            <label for="email" style="width: 80px">이메일</label>
            <input type="text" id="email" name="email" class="form-control">
        </div>

        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-secondary">[취소]</button>
            <button class="btn btn-success">[저장]</button>
        </div>

    </section>

    <section class="mt-3">
        <h2 class="mb-4">학습 현황</h2>

        <div class="d-flex gap-5 justify-content-center">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">HTML/CSS</h5>
                    <p class="card-text">학습 중</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Python</h5>
                    <p class="card-text">복습 완료</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Algorithm</h5>
                    <p class="card-text">문제 풀이</p>
                </div>
            </div>
        </div>


    </section>


</body>

</html>
