<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>HTML/CSS 최종 독립 재현</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="f3_independent_reproduction.css">
</head>

<body>
    <header class="d-flex justify-content-between align-items-center">
        <h1>Study week</h1>
        <div class="d-flex gap-2">
            <a href="#">기록</a>
            <a href="#">설정</a>
        </div>
    </header>

    <main>
        <section class="d-flex gap-4 justify-content-center mt-5">
            <div class="box">
                <h2 class="mb-4">이번 주 목표</h2>
                <p>HTML/CSS 마무리</p>
                <p>알고리즘 복습</p>
            </div>

            <div class="box">
                <h2 class="mb-4">빠른 기록</h2>

                <div class="d-flex align-items-center">
                    <label for="study" style="min-width: 75px">공부 내용</label>
                    <input type="text" id="study" name="study-record" class="form-control">
                </div>

                <div class="d-flex justify-content-end mt-3">
                    <button class="btn btn-success" style="width: 100px">[기록하기]</button>
                </div>
            </div>
        </section>

        <section class="bottom-section">
            <h2 class="mt-4">추천 학습</h2>
            <div class="d-flex justify-content-center gap-5">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">[Flexbox]</h5>
                        <p class="card-text">배치 연습</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">[Bootstrap]</h5>
                        <p class="card-text">컴포넌트 활용</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">[CSS 효과]</h5>
                        <p class="card-text">transition</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

</body>

</html>
