<!DOCTYPE html>
<html>

<!-- 1. 현재 단계 / 이번 주 학습 / 자주 사용하는 사이트는
   서로 다른 주제를 가진 영역이다.
   이번에 새로 배운 어떤 태그로 각각 묶는가?
   <section></section>tag로 묶는다.

2. 세 영역 모두 같은 box 디자인을 사용한다.
   각각 같은 class / 서로 다른 id 중 무엇이 적절한가?
   이유는?
   여러 element를 같은 그룹으로 묶는 class selector를 사용하는게 좋다.

3. 각 영역 안의 헤딩 3개도 같은 글자색을 사용한다.
   어떤 방식으로 묶는 것이 적절한가?
   여러 element를 같은 그룹으로 묶는 class selector를 사용하는게 좋다.

4. 이번 주 학습 3항목은 순서가 중요하다.
   목록 전체와 항목 하나에 각각 어떤 태그가 필요한가?
   목록 전체에는 <ol></ol>태그가 항목 하나에는 <li></li>태그가 필요하다

5. GitHub 하나는
   '목록 항목'이면서 '링크'이다.
   어떤 태그들을 어떻게 연결해야 하는가?
   <li><a href="..."></a></li>처럼 항목 태그와 링크 태그를 연속으로 연결한다. -->
