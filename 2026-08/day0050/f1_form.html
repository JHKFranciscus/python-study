<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>form 연습</title>
</head>

<body>
    <form action="http://127.0.0.1:5000/books" method="post">
        <div>
            <label for="title">도서 제목</label>
            <input id="title" type="text" name="title">
        </div>

        <div>
            <label for="price">가격</label>
            <input id="price" type="number" name="price">
        </div>

        <button type="submit">[도서 등록]</button>
    </form>
</body>

</html>
