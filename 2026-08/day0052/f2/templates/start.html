<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Flask + Jinja 데이터 흐름 직접 구현start</title>
</head>

<body>
    {% if books %}
    {% for book in books %}
    <a href="{{ url_for('book_detail', book_id=book.id) }}">{{book.title}}</a>
    {% endfor %}
    {% endif %}

    <form action="/start" method="post">
        <input type="text" name="inputTitle">
        <input type="number" name="inputPrice">

        <button type="submit">새 책 등록</button>
    </form>
</body>

</html>
