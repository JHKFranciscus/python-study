<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Template 연습</title>
</head>

<body>
    <h1>{{ text }}</h1>
    <hr>

    <form action="/books" method="post">
        <div>
            <label for="title">제목: </label>
            <input type="text" id="title" name="title">
        </div>

        <div>
            <label for="price">가격: </label>
            <input type="number" id="price" name="price">
        </div>

        <br>

        <button type="submit">[추가]</button>
    </form>
    <hr>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>가격</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
        </thead>

        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book["_id"] }}</td>
                <td>{{ book["title"] }}</td>
                <td>{{ book["price"] }}</td>
                <td>
                    <a href="books/{{book['_id']}}/edit">수정</a>
                </td>
                <td>
                    <form action="books/{{book['_id']}}/delete" method="post">
                        <button type="submit">삭제</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>

</html>
